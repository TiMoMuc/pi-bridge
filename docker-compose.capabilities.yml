services:
  pdf-api:
    image: "ghcr.io/timomuc/pdf-api:latest"
    container_name: "${COMPOSE_PROJECT_NAME:-pi-bridge}-pdf-api"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - capabilities-internal
    labels:
      io.pi-bridge.capability: "pdf-api"
      io.pi-bridge.project: "${COMPOSE_PROJECT_NAME:-pi-bridge}"

networks:
  capabilities-internal:
    name: "${COMPOSE_PROJECT_NAME:-pi-bridge}-capabilities-internal"
    internal: true
