services:
  pdf-api:
    image: "ghcr.io/timomuc/pdf-api:v0.2.0"
    container_name: "${COMPOSE_PROJECT_NAME:-pi-bridge}-pdf-api"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - capabilities-internal
    labels:
      io.pi-bridge.capability: "pdf-api"
      io.pi-bridge.project: "${COMPOSE_PROJECT_NAME:-pi-bridge}"

  # Optional spreadsheet recalculation backend.
  #
  # This is intentionally commented out by default. The bridge exposes it to
  # workspaces under the narrow capability name `spreadsheetRecalc` and the
  # narrow network alias `spreadsheet-recalc`, but the underlying REST API is
  # broader than recalculation alone. In the current trusted-user model we keep
  # the implementation lean and document that restriction honestly as soft, not
  # hard.
  #
  # spreadsheet-recalc:
  #   image: "ghcr.io/timomuc/spreadsheet-recalc:v0.1.0"
  #   container_name: "${COMPOSE_PROJECT_NAME:-pi-bridge}-spreadsheet-recalc"
  #   restart: unless-stopped
  #   networks:
  #     - capabilities-internal
  #   labels:
  #     io.pi-bridge.capability: "spreadsheet-recalc"
  #     io.pi-bridge.project: "${COMPOSE_PROJECT_NAME:-pi-bridge}"

networks:
  capabilities-internal:
    name: "${COMPOSE_PROJECT_NAME:-pi-bridge}-capabilities-internal"
    internal: true
