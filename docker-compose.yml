services:

  code-server-image:
    build:
      context: .
      dockerfile: Dockerfile.code-server
    image: "${CODE_SERVER_IMAGE:-${COMPOSE_PROJECT_NAME:-pi-bridge}-code-server:latest}"
    entrypoint: ["sh", "-lc"]
    command: ["code-server --version"]
    restart: "no"

  sandbox-image:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: "${SANDBOX_IMAGE:-${COMPOSE_PROJECT_NAME:-pi-bridge}-sandbox:latest}"
    command: ["sh", "-lc", "python3 --version && uv --version && pip --version"]
    restart: "no"

  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${COMPOSE_PROJECT_NAME:-pi-bridge}:latest"
    container_name: "${COMPOSE_PROJECT_NAME:-pi-bridge}"
    restart: unless-stopped
    user: "${BRIDGE_RUNTIME_UID:-0}:${BRIDGE_RUNTIME_GID:-0}"
    group_add:
      - "${BRIDGE_DOCKER_SOCKET_GID:-0}"
    ports:
      - "${NEXTCLOUD_WEBHOOK_PORT:-8788}:${NEXTCLOUD_WEBHOOK_PORT:-8788}"
      - "${CALENDAR_HTTP_PORT:-8789}:${CALENDAR_HTTP_PORT:-8789}"
      - "${SESSION_WATCH_PORT:-8791}:${SESSION_WATCH_PORT:-8791}"
      - "127.0.0.1:${ADMIN_UI_PORT:-8792}:${ADMIN_UI_PORT:-8792}"
    depends_on:
      code-server-image:
        condition: service_completed_successfully
      sandbox-image:
        condition: service_completed_successfully
    volumes:
      - ${BRIDGE_DATA_HOST_DIR:-./bridge-data}:${BRIDGE_DATA_DIR:-/bridge-data}
      - ${PROJECTS_HOST_DIR:-${BRIDGE_DATA_HOST_DIR:-./bridge-data}/projects}:${PROJECTS_DIR:-/bridge-data/projects}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BRIDGE_CONTAINER_NAME: "${COMPOSE_PROJECT_NAME:-pi-bridge}"
      SIGNAL_CLI_URL: "${SIGNAL_CLI_URL:-http://host.docker.internal:8080}"
      SIGNAL_PHONE_NUMBER: "${SIGNAL_PHONE_NUMBER}"
      NEXTCLOUD_BASE_URL: "${NEXTCLOUD_BASE_URL:-}"
      NEXTCLOUD_BOT_SECRET: "${NEXTCLOUD_BOT_SECRET:-}"
      NEXTCLOUD_WEBHOOK_HOST: "${NEXTCLOUD_WEBHOOK_HOST:-0.0.0.0}"
      NEXTCLOUD_WEBHOOK_PORT: "${NEXTCLOUD_WEBHOOK_PORT:-8788}"
      NEXTCLOUD_WEBHOOK_PATH: "${NEXTCLOUD_WEBHOOK_PATH:-/nextcloud-talk-webhook}"
      NEXTCLOUD_API_USER: "${NEXTCLOUD_API_USER:-}"
      NEXTCLOUD_API_PASSWORD: "${NEXTCLOUD_API_PASSWORD:-}"
      NC_URL: "${NC_URL:-}"
      NC_BOT_SECRET: "${NC_BOT_SECRET:-}"
      NC_USER: "${NC_USER:-}"
      NC_APP_TOKEN: "${NC_APP_TOKEN:-}"
      NC_WEBHOOK_HOST: "${NC_WEBHOOK_HOST:-}"
      NC_WEBHOOK_PORT: "${NC_WEBHOOK_PORT:-}"
      NC_WEBHOOK_PATH: "${NC_WEBHOOK_PATH:-}"
      PI_CODING_AGENT_DIR: "${PI_CODING_AGENT_DIR:-}"
      PI_PROVIDER: "${PI_PROVIDER:-anthropic}"
      PI_MODEL: "${PI_MODEL:-claude-sonnet-4-5}"
      PI_THINKING_LEVEL: "${PI_THINKING_LEVEL:-off}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      BRIDGE_ACCESS_MODE: "${BRIDGE_ACCESS_MODE:-open}"
      ADMIN_PHONE: "${ADMIN_PHONE:-}"
      BRIDGE_RUNTIME_UID: "${BRIDGE_RUNTIME_UID:-}"
      BRIDGE_RUNTIME_GID: "${BRIDGE_RUNTIME_GID:-}"
      BRIDGE_DOCKER_SOCKET_GID: "${BRIDGE_DOCKER_SOCKET_GID:-}"
      BLUEPRINT_DIR: "/app/__blueprint__"
      BRIDGE_DATA_DIR: "${BRIDGE_DATA_DIR:-/bridge-data}"
      PROJECTS_DIR: "${PROJECTS_DIR:-/bridge-data/projects}"
      BRIDGE_DATA_HOST_DIR: "${BRIDGE_DATA_HOST_DIR:-}"
      PROJECTS_HOST_DIR: "${PROJECTS_HOST_DIR:-}"
      BRIDGE_DATA_DIR_HOST: "${BRIDGE_DATA_DIR_HOST:-}"
      PROJECTS_DIR_HOST: "${PROJECTS_DIR_HOST:-}"
      SANDBOX_IMAGE: "${SANDBOX_IMAGE:-${COMPOSE_PROJECT_NAME:-pi-bridge}-sandbox:latest}"
      SANDBOX_MEMORY: "${SANDBOX_MEMORY:-536870912}"
      SANDBOX_CPUS: "${SANDBOX_CPUS:-1000000000}"
      SANDBOX_NETWORK: "${SANDBOX_NETWORK:-none}"
      SANDBOX_CWD: "${SANDBOX_CWD:-.}"
      CODE_SERVER_IMAGE: "${CODE_SERVER_IMAGE:-${COMPOSE_PROJECT_NAME:-pi-bridge}-code-server:latest}"
      CODE_SERVER_BIND_HOST: "${CODE_SERVER_BIND_HOST:-127.0.0.1}"
      CODE_SERVER_PORT_START: "${CODE_SERVER_PORT_START:-18440}"
      CODE_SERVER_PUBLIC_URL_TEMPLATE: "${CODE_SERVER_PUBLIC_URL_TEMPLATE:-}"
      CODE_SERVER_EXTENSIONS_MODE: "${CODE_SERVER_EXTENSIONS_MODE:-append}"
      CODE_SERVER_EXTENSIONS: "${CODE_SERVER_EXTENSIONS:-}"
      DEFAULT_NEW_WORKSPACE_CODE_SERVER_ENABLED: "${DEFAULT_NEW_WORKSPACE_CODE_SERVER_ENABLED:-false}"
      DEFAULT_NEW_WORKSPACE_CALENDAR_ENABLED: "${DEFAULT_NEW_WORKSPACE_CALENDAR_ENABLED:-false}"
      DEFAULT_NEW_WORKSPACE_BOOT_ENABLED: "${DEFAULT_NEW_WORKSPACE_BOOT_ENABLED:-true}"
      CALENDAR_ENABLED: "${CALENDAR_ENABLED:-false}"
      CALENDAR_HTTP_HOST: "${CALENDAR_HTTP_HOST:-0.0.0.0}"
      CALENDAR_HTTP_PORT: "${CALENDAR_HTTP_PORT:-8789}"
      CALENDAR_PUBLIC_BASE_URL: "${CALENDAR_PUBLIC_BASE_URL:-}"
      CALENDAR_REFRESH_INTERVAL: "${CALENDAR_REFRESH_INTERVAL:-PT15M}"
      SESSION_WATCH_ENABLED: "${SESSION_WATCH_ENABLED:-false}"
      SESSION_WATCH_HOST: "${SESSION_WATCH_HOST:-0.0.0.0}"
      SESSION_WATCH_PORT: "${SESSION_WATCH_PORT:-8791}"
      SESSION_WATCH_PUBLIC_BASE_URL: "${SESSION_WATCH_PUBLIC_BASE_URL:-}"
      ADMIN_UI_PORT: "${ADMIN_UI_PORT:-8792}"
      ADMIN_UI_USER: "${ADMIN_UI_USER:-}"
      ADMIN_UI_PASSWORD: "${ADMIN_UI_PASSWORD:-}"
